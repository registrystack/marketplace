name: Marketplace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-ci-${{ github.ref }}
  cancel-in-progress: true

# Review artifacts never receive live form or analytics configuration.
env:
  PUBLIC_UMAMI_WEBSITE_ID: ''
  PUBLIC_UMAMI_SCRIPT_SRC: ''
  PUBLIC_STARTER_REQUEST_ENDPOINT: ''

jobs:
  check:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check catalogue and build
        run: npm run check:ci
      - name: Check local browser journeys
        run: node scripts/check-browser.mjs
      - name: Check isolated request and analytics funnel
        run: npm run test:funnel
      - name: Verify review artifact
        run: node scripts/verify-preview-artifact.mjs
      - name: Upload verified preview site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketplace-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser review images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-review
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
